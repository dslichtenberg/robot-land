<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Robot Land to Gecko Land</title>
  <!-- version:start (written by tools/stamp-version.mjs) -->
  <script>window.V = '202611030057';</script>
  <link rel="stylesheet" href="style.css?v=202611030057">
  <!-- three.js is copied into vendor/ so the game never needs the internet. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/",
        "./src/audio.js": "./src/audio.js?v=202611030057",
        "./src/input.js": "./src/input.js?v=202611030057",
        "./src/laser.js": "./src/laser.js?v=202611030057",
        "./src/main.js": "./src/main.js?v=202611030057",
        "./src/models.js": "./src/models.js?v=202611030057",
        "./src/rooms/common.js": "./src/rooms/common.js?v=202611030057",
        "./src/rooms/ice.js": "./src/rooms/ice.js?v=202611030057",
        "./src/rooms/lava.js": "./src/rooms/lava.js?v=202611030057",
        "./src/rooms/levers.js": "./src/rooms/levers.js?v=202611030057",
        "./src/rooms/mirrors.js": "./src/rooms/mirrors.js?v=202611030057",
        "./src/roster.js": "./src/roster.js?v=202611030057",
        "./src/story.js": "./src/story.js?v=202611030057",
        "./src/world.js": "./src/world.js?v=202611030057",
        "./src/worlds.js": "./src/worlds.js?v=202611030057"
      }
    }
  </script>
  <!-- version:end -->
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="hearts"></div>
    <div id="hud-right">
      <button id="btn-mute" class="icon-btn" aria-label="Sound on or off">🔊</button>
      <button id="btn-phone" class="icon-btn" aria-label="Phone">📱</button>
    </div>
  </div>

  <div id="powers"></div>
  <div id="joystick" class="hidden"><div id="knob"></div></div>

  <div id="loading" class="screen"><div class="loader">🦎</div><p>Loading…</p></div>

  <div id="title-screen" class="screen hidden">
    <div class="logo">
      <div class="logo-robot">Robot Land</div>
      <div class="logo-to">to</div>
      <div class="logo-gecko">Gecko Land</div>
    </div>
    <div class="title-bottom">
      <p id="title-hint" class="start-pill">▶ Press any key or tap to start</p>
      <div id="title-buttons" class="hidden">
        <button id="btn-continue" class="big-btn">▶ Continue</button>
        <button id="btn-new" class="big-btn alt">New Game</button>
      </div>
    </div>
  </div>

  <div id="select-screen" class="screen hidden">
    <h2>Pick your driver!</h2>
    <div id="cards"></div>
  </div>

  <div id="phone" class="overlay hidden">
    <div class="phone-body">
      <div class="phone-top">📱 Robot Phone</div>
      <div id="phone-status"></div>
      <div id="phone-goal"></div>
      <div id="phone-items"></div>
      <div id="phone-answer" class="hidden"><div class="bubble-icon">🤖</div><p id="phone-hint"></p></div>
      <button id="btn-call" class="big-btn">📞 Call a Robot</button>
      <button id="btn-close" class="big-btn alt">Close</button>
    </div>
  </div>

  <div id="story" class="overlay hidden">
    <div class="story-card">
      <div id="story-art"></div>
      <p id="story-text"></p>
      <div id="story-dots"></div>
      <div class="story-buttons">
        <button id="story-skip" class="big-btn alt">Skip</button>
        <button id="story-next" class="big-btn">Next ▶</button>
      </div>
    </div>
  </div>

  <div id="dialog" class="overlay hidden">
    <div class="bubble">
      <div class="bubble-icon">🤖</div>
      <p id="dialog-text"></p>
      <button id="dialog-ok" class="big-btn">OK!</button>
    </div>
  </div>

  <div id="room-status" class="hidden"></div>
  <div id="speech" class="hidden"></div>
  <div id="banner" class="hidden">
    <p id="banner-text"></p>
    <button id="btn-banner" class="big-btn">Yay! ▶</button>
  </div>
  <div id="toast" class="hidden"></div>

  <div id="end-screen" class="screen hidden">
    <h2 id="end-text"></h2>
    <p id="end-sub"></p>
    <button id="btn-again" class="big-btn">Play Again</button>
  </div>

  <div id="fade"></div>

  <script src="src/roster.js?v=202611030057"></script>
  <script type="module" src="src/main.js?v=202611030057"></script>
</body>
</html>
